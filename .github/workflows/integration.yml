name: Integration

# Live provider tests cost money and need credentials, so they never run on a
# pull request. No provider adapters exist yet (plan Phase 2); re-enable the
# schedule once tests/live has tests.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to exercise (blank runs every configured provider)"
        required: false
        default: ""
        type: choice
        options: ["", anthropic, openai]

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  integration:
    name: Live provider tests
    runs-on: ubuntu-latest
    # Point this environment at the repository secrets below and require
    # approval if you want a human gate before spending provider quota.
    environment: integration
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/*/pyproject.toml

      - name: Install
        run: make setup PYTHON=python

      - name: Run live tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLMGRID_LIVE_PROVIDER: ${{ inputs.provider }}
        # Tests skip themselves when their credential is absent.
        run: make live-test
