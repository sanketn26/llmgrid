[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llmgrid"
version = "0.1.0a1"
description = "Typed, composable agent building blocks with explicit budgets and outcomes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sanket Naik", email = "sanketn@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# Meta-package: installs every llmgrid distribution and ships no code of its own.
dependencies = [
  "llmgrid-interfaces>=0.1.0a1,<0.2",
  "llmgrid-network>=0.1.0a1,<0.2",
  "llmgrid-tools>=0.1.0a1,<0.2",
  "llmgrid-context>=0.1.0a1,<0.2",
  "llmgrid-rag>=0.1.0a1,<0.2",
  "llmgrid-loops>=0.1.0a1,<0.2",
]

[project.urls]
Homepage = "https://github.com/sanketn26/llmgrid"
Source = "https://github.com/sanketn26/llmgrid"
Issues = "https://github.com/sanketn26/llmgrid/issues"

[tool.hatch.build.targets.wheel]
bypass-selection = true
