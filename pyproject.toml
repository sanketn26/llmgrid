# Workspace tooling configuration only. This file is not a distribution:
# each package under packages/ has its own pyproject.toml and is built and
# published on its own (see the Makefile).

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages", "tests"]
# importlib mode lets packages/*/tests share file layout without name clashes.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "live: hits a live provider; requires credentials and is deselected by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["llmgrid"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Each package contributes a portion of the `llmgrid` namespace package.
mypy_path = [
  "packages/interfaces/src",
  "packages/network/src",
  "packages/tools/src",
  "packages/context/src",
  "packages/rag/src",
  "packages/loops/src",
  "examples/tool_agent",
]
explicit_package_bases = true
files = ["packages", "tests", "examples"]
exclude = ["^legacy/", "/build/", "/dist/"]
